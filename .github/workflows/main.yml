name: push_to_main
on:
  push:
    branches: main
  workflow_dispatch:   
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: create image
      run: docker build -t petclinic:latest .

    - name: tag
      run: docker tag petclinic:latest skhachatryan11/main:latest

    - name: login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: push
      run: docker push skhachatryan11/main:latest