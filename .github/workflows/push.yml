  docker:
    runs-on: ubuntu-latest

    services:
      nexus:
        image: sonatype/nexus3
        ports:
          - 8081:8081
          - 5003:5003
        options: >-
          --health-cmd="curl -f http://localhost:8081 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Nexus API
        run: |
          until curl -sf http://localhost:8081/ > /dev/null; do
            sleep 5
          done

      - name: Get admin password
        run: |
          ADMIN_PASSWORD=$(docker exec ${{ job.services.nexus.id }} cat /nexus-data/admin.password)
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> $GITHUB_ENV

      - name: Configure Nexus (Docker repo)
        run: |
          # Enable Docker realm
          curl -u admin:$ADMIN_PASSWORD -X PUT \
            -H "Content-Type: application/json" \
            http://localhost:8081/service/rest/v1/security/realms/active \
            -d '["NexusAuthenticatingRealm","DockerToken"]'

          # Create Docker hosted repo
          curl -u admin:$ADMIN_PASSWORD -X POST \
            -H "Content-Type: application/json" \
            http://localhost:8081/service/rest/v1/repositories/docker/hosted \
            -d '{
              "name": "docker-hosted",
              "online": true,
              "storage": { "blobStoreName": "default" },
              "docker": {
                "v1Enabled": false,
                "forceBasicAuth": false,
                "httpPort": 5003
              }
            }'

      - name: Allow insecure registry
        run: |
          echo '{"insecure-registries":["localhost:5003"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Build image
        run: docker build -t petclinic:latest .

      - name: Login to Nexus
        run: docker login localhost:5003 -u admin -p $ADMIN_PASSWORD

      - name: Tag image
        run: docker tag petclinic:latest localhost:5003/docker-hosted/petclinic:latest

      - name: Push image
        run: docker push localhost:5003/docker-hosted/petclinic:latest