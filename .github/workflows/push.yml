  docker:
    runs-on: ubuntu-latest
    # needs: build
    services:
      nexus:
        image: sonatype/nexus3
        ports: 
        - 8081:8081
        - 5003:5003

    steps:
    - uses: actions/setup-java@v4
      with: 
        distribution: temurin
        java-version: 17

    - uses: actions/checkout@v4

    - name: Wait for Nexus
      run: |
          for i in {1..60}; do
            curl -s http://localhost:8081 && break
            sleep 5
          done

    - name: create image
      run: docker build -t petclinic:latest .

    - name: nexus login
      run: echo ${{ secrets.NEXUS_PASSWORD }} | docker login host.docker.internal:5003 -u admin --password-stdin 

    - name: tag image
      run: docker tag petclinic:latest localhost:5003/petclinic:latest

    - name: push image
      run: docker push localhost:5003/petclinic:latest
